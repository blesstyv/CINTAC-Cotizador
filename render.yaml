databases:
  - name: cintac-cotizador-db
    plan: free
    databaseName: cintac_cotizador
    user: cintac
    postgresMajorVersion: "16"

services:
  - type: web
    name: cintac-cotizador-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /health/
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cintac-cotizador-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # Origen exacto del frontend publicado. Una expresión regular
      # amplia aceptaba cualquier servicio "cintac-cotizador-*" de Render.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://cintac-cotizador.onrender.com"
      - key: TOKEN_EXPIRATION_HOURS
        value: "8"
      - key: USD_CLP_FALLBACK_VALUE
        value: "976.82"
      - key: USD_CLP_FALLBACK_DATE
        value: "2026-10-22"
      - key: USD_CLP_FALLBACK_SOURCE
        value: "Banco Central de Chile - Dolar Observado"
      - key: PYTHON_VERSION
        value: "3.13.14"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin_cintac
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@cintac.cl
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: web
    name: cintac-cotizador
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24.15.0"
      - key: VITE_API_URL
        fromService:
          name: cintac-cotizador-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://cintac-cotizador-api.onrender.com; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
