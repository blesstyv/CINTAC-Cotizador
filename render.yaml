databases:
  - name: cintac-cotizador-db
    plan: free
    databaseName: cintac_cotizador
    user: cintac

services:
  - type: web
    name: cintac-cotizador-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    initialDeployHook: python manage.py bootstrap_production
    healthCheckPath: /health/
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cintac-cotizador-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: "^https://cintac-cotizador.*\\.onrender\\.com$"
      - key: TOKEN_EXPIRATION_HOURS
        value: "8"
      - key: PYTHON_VERSION
        value: "3.13.14"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin_cintac
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@cintac.cl
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: web
    name: cintac-cotizador
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24.15.0"
      - key: VITE_API_URL
        fromService:
          name: cintac-cotizador-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
